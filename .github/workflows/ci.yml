name: CI

on:
  push:
    branches: [main]
  pull_request:

# Self-contained: no Nx Cloud token needed, so this stays green on a fork.
permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Sets NX_BASE / NX_HEAD for `nx affected`.
      - uses: nrwl/nx-set-shas@v4

      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nx-${{ runner.os }}-

      - run: npx nx sync:check
      - run: npx nx format:check
      - run: npx nx affected -t lint test build typecheck

  e2e:
    # Browser E2E (Playwright, V2.1 step 38) — heavier, PRs only.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - uses: nrwl/nx-set-shas@v4

      - run: npx nx affected -t e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            **/playwright-report
            **/test-results
          retention-days: 7
          if-no-files-found: ignore
