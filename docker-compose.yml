# Local end-to-end run of the built images.
#   docker compose up --build      → SPA on http://localhost:8080
# Backend config comes from the shell / an optional root .env (see
# .env.example). Nothing secret is baked into an image.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      MONGO_URI: mongodb://mongo:27017/starter
      CORS_ORIGINS: http://localhost:8080
      AUTH_COOKIE_SECURE: 'false'
      # The SPA's nginx forwards /api and sets X-Forwarded-* — trust it so
      # req.ip is the real client (rate limiting, audit, session IPs).
      TRUST_PROXY: '1'
      # Override in .env / the shell for anything real.
      JWT_SECRET: ${JWT_SECRET:-dev-only-not-for-production}
    env_file:
      - path: .env
        required: false
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_started

volumes:
  mongo-data:
